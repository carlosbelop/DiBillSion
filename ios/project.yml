# XcodeGen spec: `cd ios && xcodegen` writes DiBillSion.xcodeproj (not tracked).
# Needs Generated/ from scripts/build-xcframework.sh first.
name: DiBillSion
options:
  bundleIdPrefix: com.dibillsion
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
targets:
  DiBillSion:
    type: application
    platform: iOS
    sources:
      - path: DiBillSion
      - path: Generated/dibill_core.swift
        group: Generated
    dependencies:
      - framework: Generated/DibillCore.xcframework
        embed: false
    info: # generated by xcodegen (not tracked)
      path: DiBillSion/Info.plist
      properties:
        CFBundleDisplayName: DiBillSion
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, es]
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: AccentColor
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        # Translated in InfoPlist.xcstrings.
        NSCameraUsageDescription: Take a photo of a receipt to split it by item.
        # Sync server for this build (ADR 0007); empty means no server yet.
        DibillSyncURL: $(SYNC_URL)
        CFBundleURLTypes:
          - CFBundleURLName: com.dibillsion.app.invite
            CFBundleURLSchemes: [dibillsion]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dibillsion.app
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        OTHER_LDFLAGS: [-ObjC]
      configs:
        # The simulator reaches a server on the Mac at 127.0.0.1 (IP literals are exempt from ATS).
        Debug:
          SYNC_URL: http://127.0.0.1:8080
        Release:
          SYNC_URL: ""
  DiBillSionTests:
    type: bundle.unit-test
    platform: iOS
    sources: [DiBillSionTests]
    dependencies:
      - target: DiBillSion
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  DiBillSion:
    build:
      targets:
        DiBillSion: all
    test:
      targets: [DiBillSionTests]
      gatherCoverageData: false
