name: TestFlight

# Manual run (Actions → TestFlight → Run workflow) or a pushed `ios-v*` tag: signed Release
# archive, uploaded to App Store Connect for internal testers. On PRs: an unsigned device
# archive only, to catch Release-only build problems (same private-repo gating as ios.yml).
on:
  workflow_dispatch:
  push:
    tags: ['ios-v*']
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - ios/**
      - scripts/build-xcframework.sh
      - .github/workflows/testflight.yml

concurrency:
  group: testflight-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  UPLOAD: ${{ github.event_name != 'pull_request' }}

# Explicit bash gets `-eo pipefail`, so `| xcbeautify` can't hide a failure.
defaults:
  run:
    shell: bash

jobs:
  archive:
    name: Archive (and upload to TestFlight)
    if: >-
      github.event_name != 'pull_request'
      || !github.event.repository.private
      || contains(github.event.pull_request.labels.*.name, 'macos')
    runs-on: macos-26
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      # Beta server URL (repository variable). Without it the build can't invite or sync.
      SYNC_URL: ${{ vars.SYNC_URL }}
    steps:
      - name: Check the signing secrets
        if: env.UPLOAD == 'true'
        run: |
          missing=()
          for v in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 APPLE_TEAM_ID; do
            [[ -n "${!v}" ]] || missing+=("$v")
          done
          if (( ${#missing[@]} )); then
            echo "::error::Missing repository secrets: ${missing[*]} (see ios/README.md, TestFlight)"; exit 1
          fi
          [[ -n "$SYNC_URL" ]] || echo "::warning::vars.SYNC_URL is empty: this build can't sync or invite."
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
      - run: brew install xcodegen
      - run: scripts/build-xcframework.sh --device
      - run: cd ios && xcodegen
      - name: API key
        if: env.UPLOAD == 'true'
        run: |
          key="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          # Accept the .p8 as pasted, or base64-encoded.
          if grep -q "BEGIN PRIVATE KEY" <<<"$ASC_KEY_P8"; then
            printf '%s\n' "$ASC_KEY_P8" > "$key"
          else
            base64 --decode <<<"$ASC_KEY_P8" > "$key"
          fi
          echo "ASC_KEY_PATH=$key" >> "$GITHUB_ENV"
      - name: Signing (throwaway certificate and profile for this run)
        if: env.UPLOAD == 'true'
        run: |
          cd "$RUNNER_TEMP"
          openssl req -new -newkey rsa:2048 -nodes -keyout dist.key -out dist.csr \
            -subj "/CN=DiBillSion CI ${{ github.run_id }}"
          cert_id=$(python3 "$GITHUB_WORKSPACE/scripts/asc.py" create-cert dist.csr dist.pem)
          echo "CERT_ID=$cert_id" >> "$GITHUB_ENV"
          read -r profile_id uuid < <(python3 "$GITHUB_WORKSPACE/scripts/asc.py" \
            create-profile com.dibillsion.app "$cert_id" app.mobileprovision)
          echo "PROFILE_ID=$profile_id" >> "$GITHUB_ENV"
          echo "PROFILE_UUID=$uuid" >> "$GITHUB_ENV"
          for d in "$HOME/Library/MobileDevice/Provisioning Profiles" \
                   "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$d" && cp app.mobileprovision "$d/$uuid.mobileprovision"
          done
          pw=$(openssl rand -hex 16)
          kc="$RUNNER_TEMP/ci.keychain-db"
          echo "KEYCHAIN=$kc" >> "$GITHUB_ENV"
          openssl pkcs12 -export -inkey dist.key -in dist.pem -out dist.p12 -passout "pass:$pw" \
            -keypbe PBE-SHA1-3DES -certpbe PBE-SHA1-3DES -macalg sha1
          security create-keychain -p "$pw" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$pw" "$kc"
          security import dist.p12 -k "$kc" -P "$pw" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$pw" "$kc" > /dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          rm -f dist.key dist.p12
      - name: Archive
        run: |
          if [[ $UPLOAD == true ]]; then
            signing=(CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="$APPLE_TEAM_ID"
                     CODE_SIGN_IDENTITY="Apple Distribution"
                     PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID"
                     OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN")
          else
            signing=(CODE_SIGNING_ALLOWED=NO)
          fi
          xcodebuild archive -project ios/DiBillSion.xcodeproj -scheme DiBillSion \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath build/DiBillSion.xcarchive "${signing[@]}" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" SYNC_URL="$SYNC_URL" \
            | xcbeautify --renderer github-actions
      - name: Export and upload to App Store Connect
        if: env.UPLOAD == 'true'
        run: |
          sed -e "s/TEAM_ID/$APPLE_TEAM_ID/" -e "s/PROFILE_UUID/$PROFILE_UUID/" \
            ios/ExportOptions.plist > "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive -archivePath build/DiBillSion.xcarchive \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath build/export \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            | xcbeautify --renderer github-actions
          echo "Uploaded build ${{ github.run_number }}; it appears in TestFlight after processing (5–15 min)." >> "$GITHUB_STEP_SUMMARY"
      - name: Revoke the certificate and delete the profile
        if: always() && env.UPLOAD == 'true'
        run: |
          [[ -z "${PROFILE_ID:-}" ]] || python3 scripts/asc.py delete-profile "$PROFILE_ID"
          [[ -z "${CERT_ID:-}" ]] || python3 scripts/asc.py revoke-cert "$CERT_ID"
          [[ -z "${KEYCHAIN:-}" ]] || security delete-keychain "$KEYCHAIN"
      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP"/AuthKey_*.p8
