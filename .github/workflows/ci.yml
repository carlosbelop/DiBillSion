name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-24.04
    # The server's integration tests need a real PostgreSQL; here they must not be skipped.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      DIBILL_REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-llvm-cov
      - run: cargo fmt --all --check
      # `dibill-receipt/eval` also builds the HTTP client and the eval harness.
      - run: cargo clippy --workspace --all-targets --locked --features dibill-receipt/eval
      - run: cargo llvm-cov nextest --workspace --locked --features dibill-receipt/eval --lcov --output-path lcov.info
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: lcov.info

  bindings:
    name: Kotlin bindings (UniFFI)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: scripts/gen-bindings.sh
      - run: test -s target/bindings/kotlin/com/dibillsion/core/dibill_core.kt

  android:
    name: Android (cargo-ndk + Gradle)
    runs-on: ubuntu-24.04
    env:
      NDK_VERSION: 29.0.14206865   # keep in sync with scripts/setup-ubuntu.sh
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk
      - uses: gradle/actions/setup-gradle@v6
      - name: Install NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - name: Build and test
        working-directory: android
        run: ./gradlew --no-daemon :app:assembleDebug :app:testDebugUnitTest
      - uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

  deny:
    name: Dependencies (licenses, advisories)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  # Guard: build outputs and secrets must never land in the repo.
  no-binaries-or-secrets:
    name: No binaries / secrets
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: |
          if git ls-files | grep -E '\.(apk|apks|aab|dex|so|a|xcframework|ipa|keystore|jks|p12|p8|mobileprovision)$|(^|/)\.env(\..*)?$' | grep -v '\.env\.example$'; then
            echo "::error::Binaries or secrets are tracked. Remove them."; exit 1
          fi

  server-image:
    name: Server image (Docker)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Build the beta server image (amd64)
        run: docker build -f deploy/Dockerfile -t dibill-server:ci .
      - name: It starts and answers /health
        run: |
          docker network create t
          docker run -d --name db --network t -e POSTGRES_PASSWORD=ci -e POSTGRES_USER=dibill -e POSTGRES_DB=dibill postgres:17
          for i in $(seq 1 30); do docker exec db pg_isready -U dibill && break; sleep 2; done
          docker run -d --name server --network t -p 8080:8080 \
            -e DATABASE_URL=postgres://dibill:ci@db:5432/dibill dibill-server:ci
          for i in $(seq 1 30); do curl -fsS localhost:8080/health && exit 0; sleep 2; done
          docker logs server; exit 1

