name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-llvm-cov
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked
      - run: cargo llvm-cov nextest --workspace --locked --lcov --output-path lcov.info
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: lcov.info

  deny:
    name: Dependencies (licenses, advisories)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  # Guard: study material must never land in the repo.
  no-study-material:
    name: No APK / decompiled code
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: |
          if git ls-files | grep -E '(^|/)_study/|\.(apk|apks|aab|xapk|dex|smali)$'; then
            echo "::error::Study material or APK files are tracked. Remove them."; exit 1
          fi
