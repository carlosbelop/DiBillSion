# cargo-deny: dependency licenses, advisories, sources. Run: cargo deny check
[graph]
all-features = true

[advisories]
yanked = "deny"

[licenses]
# Permissive licenses only (the app is proprietary / sold in stores).
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "CC0-1.0",
]
confidence-threshold = 0.9
# The allow-list anticipates future dependencies; don't warn while unused.
unused-allowed-license = "allow"

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Internal path dependencies between our own (unpublished) crates are fine.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
