[package]
name = "dibill-core"
description = "Facade exposed to the Android/iOS apps through UniFFI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "uniffi-bindgen"
required-features = ["bindgen"]

[features]
# Builds the `uniffi-bindgen` CLI used by scripts/gen-bindings.sh. Not shipped in the apps.
bindgen = ["uniffi/cli"]

[dependencies]
base64 = "0.23"
dibill-domain.workspace = true
dibill-proto.workspace = true
dibill-receipt.workspace = true
dibill-store.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uniffi.workspace = true
uuid.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
